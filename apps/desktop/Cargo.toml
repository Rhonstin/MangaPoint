[package]
name = "mangapoint"
version.workspace = true
edition.workspace = true
description = "MangaPoint desktop app"

[dependencies]
dioxus = { version = "0.7", features = ["desktop"] }
catalog = { path = "../../crates/catalog" }
library = { path = "../../crates/library" }
sources = { path = "../../crates/sources" }
search = { path = "../../crates/search" }
pipeline = { path = "../../crates/pipeline" }
converter = { path = "../../crates/converter", features = ["serde"] }
device-profiles = { path = "../../crates/device-profiles", features = ["serde"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
futures-util = "0.3"
ctrlc = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
base64 = "0.22"
sha2 = "0.10"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
rfd = "0.17"

[dev-dependencies]
catalog = { path = "../../crates/catalog", features = ["fake"] }

[build-dependencies]
winresource = "0.1"
